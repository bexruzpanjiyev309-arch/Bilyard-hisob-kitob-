name: Build BILYARD PRO ULTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'BILYARD*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP fayl topilmadi"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BILYARD-PRO-ULTRA-APK
          path: source/**/build/outputs/apk/debug/*.apk
