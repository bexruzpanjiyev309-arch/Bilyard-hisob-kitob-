name: Build BILYARD PRO ULTRA LICENSE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract license project
        run: |
          ZIP="BILYARD_PRO_ULTRA_3.7.8_LICENSE_ANDROID_STEP2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "LICENSE STEP 2 ZIP TOPILMADI!"
            ls -lah
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT_DIR="source/BILYARD_PRO_ULTRA_3.0"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Android loyiha topilmadi!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BILYARD-PRO-ULTRA-LICENSE-APK
          path: source/BILYARD_PRO_ULTRA_3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
