name: Build BILYARD PRO ULTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact 3.7.4 source
        run: |
          ZIP="BILYARD_PRO_ULTRA_3.7.4_SOURCE.zip"
          test -f "$ZIP" || { echo "3.7.4 ZIP not found"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle -print -quit)")"
          test -n "$PROJECT_DIR" || { echo "settings.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BILYARD-PRO-ULTRA-3.7.4-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
