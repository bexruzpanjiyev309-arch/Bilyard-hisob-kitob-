name: Build BILYARD PRO ULTRA 3.7.6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract 3.7.6 source
        run: |
          ZIP="BILYARD_PRO_ULTRA_3.7.6_SOURCE.zip"
          if [ ! -f "$ZIP" ]; then
            echo "3.7.6 ZIP topilmadi!"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle loyiha topilmadi!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BILYARD-PRO-ULTRA-3.7.6-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
