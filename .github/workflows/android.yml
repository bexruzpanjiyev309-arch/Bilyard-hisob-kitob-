name: Build BILYARD PRO ULTRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source ZIP
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o BILYARD_PRO_ULTRA_3.5_SOURCE.zip -d source
          find source -name build.gradle -o -name settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd source
          PROJECT_DIR=$(find . -name settings.gradle -printf '%h\n' | head -1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BILYARD-PRO-ULTRA-APK
          path: source/**/build/outputs/apk/debug/*.apk
